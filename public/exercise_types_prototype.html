<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>文言學習 - 題型原型集</title>
<style>
  body { font-family:"Noto Sans TC",sans-serif; max-width:640px; margin:30px auto; background:#f7f6f2; color:#333; }
  .card { background:#fff; border-radius:16px; padding:22px; box-shadow:0 2px 8px rgba(0,0,0,.08); margin-bottom:24px; }
  h3 { margin-top:0; color:#1cb0f6; }
  .tag { display:inline-block; background:#e8f4ff; color:#1cb0f6; font-size:12px; padding:2px 8px; border-radius:8px; margin-bottom:8px; }
  .option { display:block; width:100%; padding:10px; margin:6px 0; border:2px solid #e0e0e0; border-radius:10px; background:#fff; cursor:pointer; font-size:15px; text-align:left; }
  .option:hover { border-color:#1cb0f6; }
  .option.correct { border-color:#58cc02; background:#d7ffb8; }
  .option.wrong { border-color:#ff4b4b; background:#ffdfe0; }
  .feedback { margin-top:10px; padding:10px; border-radius:8px; font-weight:bold; font-size:14px; }
  .feedback.correct { background:#d7ffb8; color:#2b7a00; }
  .feedback.wrong { background:#ffdfe0; color:#c40000; }

  .word-bank { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; min-height:44px; padding:8px; background:#f0f0f0; border-radius:10px; }
  .word-tile { padding:8px 14px; background:#1cb0f6; color:#fff; border-radius:8px; cursor:grab; font-size:16px; user-select:none; }
  .drop-zone { display:flex; flex-wrap:wrap; gap:8px; min-height:44px; padding:8px; border:2px dashed #ccc; border-radius:10px; margin-bottom:10px; }
  .drop-zone .word-tile { background:#58cc02; cursor:pointer; }

  .match-container { display:flex; gap:20px; }
  .match-col { flex:1; }
  .match-item { padding:10px; margin:6px 0; border:2px solid #e0e0e0; border-radius:10px; cursor:pointer; text-align:center; font-size:15px; }
  .match-item.selected { border-color:#1cb0f6; background:#e8f4ff; }
  .match-item.matched { border-color:#58cc02; background:#d7ffb8; cursor:default; }

  input.fill-input { padding:8px 12px; border:2px solid #e0e0e0; border-radius:8px; font-size:16px; width:140px; }
  button.check-btn { margin-top:10px; padding:10px 20px; background:#58cc02; color:#fff; border:none; border-radius:10px; font-size:15px; font-weight:bold; cursor:pointer; }
</style>
</head>
<body>

<h2 style="text-align:center;">文言學習題型設計原型</h2>

<div class="card">
  <span class="tag">字義選擇題</span>
  <h3>『謫守巴陵郡』中『謫』字的意思是？</h3>
  <div id="q1options"></div>
  <div class="feedback" id="q1feedback"></div>
</div>

<div class="card">
  <span class="tag">句子重組 · 賓語前置還原</span>
  <h3>將詞塊拖曳排成正確語序（原句出自《岳陽樓記》）</h3>
  <div class="drop-zone" id="dropZone"></div>
  <div class="word-bank" id="wordBank"></div>
  <button class="check-btn" onclick="checkReorder()">檢查答案</button>
  <div class="feedback" id="q2feedback"></div>
</div>

<div class="card">
  <span class="tag">配對題 · 虛詞多義配對</span>
  <h3>將「之」的用法與對應例句配對</h3>
  <div class="match-container">
    <div class="match-col" id="matchLeft"></div>
    <div class="match-col" id="matchRight"></div>
  </div>
  <div class="feedback" id="q3feedback"></div>
</div>

<div class="card">
  <span class="tag">填空默寫</span>
  <h3>先天下之憂而憂，<input type="text" class="fill-input" id="q4input" placeholder="請輸入">。</h3>
  <button class="check-btn" onclick="checkFill()">提交</button>
  <div class="feedback" id="q4feedback"></div>
</div>

<div class="card">
  <span class="tag">判斷句式題</span>
  <h3>『廉頗者，趙之良將也』屬於哪種句式？</h3>
  <div id="q5options"></div>
  <div class="feedback" id="q5feedback"></div>
</div>

<div class="card">
  <span class="tag">語譯選擇</span>
  <h3>『微斯人，吾誰與歸』的正確白話翻譯是？</h3>
  <div id="q6options"></div>
  <div class="feedback" id="q6feedback"></div>
</div>

<div class="card">
  <span class="tag">詞類活用標記</span>
  <h3>點擊句中活用的字：「先天下之憂而憂，後天下之樂而樂」</h3>
  <div id="q7sentence"></div>
  <div class="feedback" id="q7feedback"></div>
</div>

<script>
function renderQ1() {
  const opts = ["提拔","貶官","辭職","退休"];
  const answer = "貶官";
  const box = document.getElementById("q1options");
  opts.forEach(o => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = o;
    btn.onclick = () => {
      document.querySelectorAll("#q1options .option").forEach(b=>b.onclick=null);
      const fb = document.getElementById("q1feedback");
      if (o === answer) { btn.classList.add("correct"); fb.className="feedback correct"; fb.textContent="答對了！"; }
      else { btn.classList.add("wrong"); fb.className="feedback wrong"; fb.textContent=`正確答案：${answer}`; }
    };
    box.appendChild(btn);
  });
}

const correctOrder = ["吾","誰","與","歸"];
let shuffled = ["誰","歸","與","吾"];
function renderReorder() {
  const bank = document.getElementById("wordBank");
  const zone = document.getElementById("dropZone");
  bank.innerHTML = ""; zone.innerHTML = "";
  shuffled.forEach(word => {
    const tile = document.createElement("div");
    tile.className = "word-tile";
    tile.textContent = word;
    tile.draggable = true;
    tile.ondragstart = e => e.dataTransfer.setData("text", word);
    tile.onclick = () => {
      if (tile.parentElement.id === "wordBank") {
        zone.appendChild(tile);
      } else {
        bank.appendChild(tile);
      }
    };
    bank.appendChild(tile);
  });
  zone.ondragover = e => e.preventDefault();
  zone.ondrop = e => {
    e.preventDefault();
    const word = e.dataTransfer.getData("text");
    const tile = [...bank.children].find(t => t.textContent === word);
    if (tile) zone.appendChild(tile);
  };
}
function checkReorder() {
  const zone = document.getElementById("dropZone");
  const current = [...zone.children].map(t => t.textContent);
  const fb = document.getElementById("q2feedback");
  if (JSON.stringify(current) === JSON.stringify(correctOrder)) {
    fb.className = "feedback correct"; fb.textContent = "正確！『吾誰與歸』— 疑問代詞『誰』作賓語前置";
  } else {
    fb.className = "feedback wrong"; fb.textContent = `順序不對，正確語序：${correctOrder.join("")}`;
  }
}

const pairs = [
  {left:"之(動詞：到/往)", right:"輟耕之壟上"},
  {left:"之(代詞：他)", right:"公與之乘"},
  {left:"之(結構助詞：的)", right:"三里之城"}
];
let selectedLeft = null;
function renderMatch() {
  const leftCol = document.getElementById("matchLeft");
  const rightCol = document.getElementById("matchRight");
  const shuffledRight = [...pairs].sort(()=>Math.random()-0.5);
  pairs.forEach(p => {
    const item = document.createElement("div");
    item.className = "match-item";
    item.textContent = p.left;
    item.dataset.match = p.right;
    item.onclick = () => selectMatch(item, "left");
    leftCol.appendChild(item);
  });
  shuffledRight.forEach(p => {
    const item = document.createElement("div");
    item.className = "match-item";
    item.textContent = p.right;
    item.dataset.match = p.left;
    item.onclick = () => selectMatch(item, "right");
    rightCol.appendChild(item);
  });
}
function selectMatch(item, side) {
  if (item.classList.contains("matched")) return;
  if (!selectedLeft) {
    selectedLeft = item;
    item.classList.add("selected");
    return;
  }
  const a = selectedLeft, b = item;
  const isCorrect = a.dataset.match === b.textContent || b.dataset.match === a.textContent;
  const fb = document.getElementById("q3feedback");
  if (isCorrect) {
    a.classList.remove("selected"); a.classList.add("matched");
    b.classList.add("matched");
    fb.className = "feedback correct"; fb.textContent = "配對正確！";
  } else {
    a.classList.remove("selected");
    fb.className = "feedback wrong"; fb.textContent = "配對錯誤，再試一次";
  }
  selectedLeft = null;
}

function normalize(str) {
  return str.replace(/[，。、；：！？\s]/g,"");
}
function checkFill() {
  const input = document.getElementById("q4input").value;
  const answer = "後天下之樂而樂";
  const fb = document.getElementById("q4feedback");
  if (normalize(input) === normalize(answer)) {
    fb.className = "feedback correct"; fb.textContent = "默寫正確！";
  } else {
    fb.className = "feedback wrong"; fb.textContent = `正確答案：${answer}`;
  }
}

function renderQ5() {
  const opts = ["判斷句","被動句","省略句","倒裝句"];
  const answer = "判斷句";
  const box = document.getElementById("q5options");
  opts.forEach(o => {
    const btn = document.createElement("button");
    btn.className = "option"; btn.textContent = o;
    btn.onclick = () => {
      document.querySelectorAll("#q5options .option").forEach(b=>b.onclick=null);
      const fb = document.getElementById("q5feedback");
      if (o === answer) { btn.classList.add("correct"); fb.className="feedback correct"; fb.textContent="正確！『者...也』是判斷句標誌"; }
      else { btn.classList.add("wrong"); fb.className="feedback wrong"; fb.textContent=`正確答案：${answer}`; }
    };
    box.appendChild(btn);
  });
}

function renderQ6() {
  const opts = ["如果沒有這樣的人，我要跟從誰呢？","如果沒有這樣的人，誰會跟從我呢？","沒有這樣的人，我不知道去哪裡。","這個人不存在，我們一起回去。"];
  const answer = opts[0];
  const box = document.getElementById("q6options");
  opts.forEach(o => {
    const btn = document.createElement("button");
    btn.className = "option"; btn.textContent = o;
    btn.onclick = () => {
      document.querySelectorAll("#q6options .option").forEach(b=>b.onclick=null);
      const fb = document.getElementById("q6feedback");
      if (o === answer) { btn.classList.add("correct"); fb.className="feedback correct"; fb.textContent="答對了！"; }
      else { btn.classList.add("wrong"); fb.className="feedback wrong"; fb.textContent="語序理解錯誤，注意『誰與歸』= 與誰歸"; }
    };
    box.appendChild(btn);
  });
}

function renderQ7() {
  const chars = ["先","天","下","之","憂","而","憂","，","後","天","下","之","樂","而","樂"];
  const activatedIndices = [0, 8];
  const container = document.getElementById("q7sentence");
  chars.forEach((ch, i) => {
    const span = document.createElement("span");
    span.textContent = ch;
    span.style.cursor = "pointer";
    span.style.padding = "4px 2px";
    span.style.fontSize = "18px";
    span.onclick = () => {
      const fb = document.getElementById("q7feedback");
      if (activatedIndices.includes(i)) {
        span.style.background = "#d7ffb8";
        fb.className = "feedback correct"; fb.textContent = `「${ch}」是方位詞使動用法，意為「使...在先/後」`;
      } else {
        span.style.background = "#ffdfe0";
        fb.className = "feedback wrong"; fb.textContent = "這個字沒有活用，再找找看";
      }
    };
    container.appendChild(span);
  });
}

renderQ1(); renderReorder(); renderMatch(); renderQ5(); renderQ6(); renderQ7();
</script>
</body>
</html>
