<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manjingo｜文言文自主學習</title>
<style>
:root{--green:#58cc02;--blue:#1cb0f6;--ink:#000437;--text:#4b4b4b;--gray:#afafaf;--red:#ff4b4b;--light-green:#d7ffb8;--light-red:#ffdfe0;--orange:#ff9600}
*{box-sizing:border-box}body{font-family:"Noto Sans TC",system-ui,sans-serif;max-width:640px;margin:20px auto;padding:0 16px 40px;color:var(--text);background:#fff}button,input{font:inherit}.title{text-align:center;color:var(--green);font-size:34px;margin:16px 0 4px}.status{text-align:center;color:var(--gray);font-size:12px;font-weight:700;margin-bottom:14px}.card{border:2px solid var(--gray);border-radius:20px;padding:16px;margin-bottom:16px;background:#fff}.top{display:flex;justify-content:space-between;align-items:center}.level{display:flex;align-items:center;gap:10px;font-weight:800}.circle{width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center}.streak{font-weight:800;color:var(--orange)}.label{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin:5px 0}.bar{height:13px;background:#e5e5e5;border:2px solid var(--gray);border-radius:10px;overflow:hidden;margin-bottom:12px}.fill{height:100%;background:var(--green);width:0}.plan-title{font-size:24px;font-weight:900;color:var(--ink)}.plan-sub{color:var(--gray);font-weight:700;margin:5px 0 14px}.stats{display:flex;gap:8px;margin-bottom:10px}.stat{flex:1;text-align:center;background:#f5f5f5;border-radius:12px;padding:10px 4px}.stat strong{display:block;color:var(--ink);font-size:18px}.stat span{font-size:12px;font-weight:700}.action,.option{width:100%;padding:14px 16px;border:2px solid var(--green);border-radius:14px;background:var(--green);color:#fff;font-weight:800;cursor:pointer;margin-top:8px}.option{background:#fff;color:var(--text);border-color:var(--gray);text-align:left;margin-top:8px}.option.correct{background:var(--light-green);border-color:var(--green)}.option.wrong{background:var(--light-red);border-color:var(--red)}.question{font-size:20px;font-weight:800;line-height:1.5;margin-bottom:18px}.feedback{padding:12px;border-radius:12px;font-weight:800;margin-top:10px}.feedback.correct{background:var(--light-green);color:#287400}.feedback.wrong{background:var(--light-red);color:#b00000}.input{width:100%;padding:13px;border:2px solid var(--gray);border-radius:14px}.hidden{display:none}.done{text-align:center;padding:25px 5px;font-weight:800}.small{font-size:12px;color:var(--gray)}
</style>
</head>
<body>
<h1 class="title">Manjingo</h1>
<div class="status" id="status">本地學習模式已準備</div>
<div class="card top"><div class="level"><div class="circle" id="level">1</div><span id="xp">共 0 XP</span></div><div class="streak">🔥 <span id="streak">0</span> 日</div></div>
<div class="card"><div class="label"><span>今日目標</span><span id="daily">0 / 20 XP</span></div><div class="bar"><div class="fill" id="dailyFill"></div></div><div class="label"><span>等級進度</span><span id="levelText">0 / 50 XP</span></div><div class="bar"><div class="fill" id="levelFill"></div></div></div>
<div class="card" id="plan"><div class="plan-title">今日學習</div><div class="plan-sub">準備好了，先用本地題目開始學習。</div><div class="stats"><div class="stat"><strong>0</strong><span>複習</span></div><div class="stat"><strong>0</strong><span>弱項</span></div><div class="stat"><strong>6</strong><span>新知識</span></div></div><button class="action" id="start">開始今日學習</button></div>
<div class="card hidden" id="quiz"></div>
<script>
(function(){
'use strict';
const questions=[
{id:'q001',kpId:'kp_yueyang_001',type:'choice',q:'『謫守巴陵郡』中『謫』字的意思是？',o:['提拔','貶官','辭職','退休'],a:'貶官'},
{id:'q004',kpId:'kp_virtual_zhi',type:'choice',q:'『輟耕之壟上』中『之』字的用法是？',o:['代詞','結構助詞（的）','動詞（到／往）','語氣助詞'],a:'動詞（到／往）'},
{id:'q005',kpId:'sx_001',type:'choice',q:'『廉頗者，趙之良將也』屬於哪種句式？',o:['判斷句','被動句','省略句','倒裝句'],a:'判斷句'},
{id:'q010',kpId:'sx_006',type:'choice',q:'『微斯人，吾誰與歸』的正確白話翻譯是？',o:['如果沒有這樣的人，我要跟從誰呢？','如果沒有這樣的人，誰會跟從我呢？','沒有這樣的人，我不知道去哪裡。','這個人不存在，我們一起回去。'],a:'如果沒有這樣的人，我要跟從誰呢？'},
{id:'q008',kpId:'kp_yueyang_004',type:'fill',q:'先天下之憂而憂，____________。',a:'後天下之樂而樂'},
{id:'q006',kpId:'sx_006',type:'choice',q:'『吾誰與歸』中『歸』的意思是？',o:['歸還','歸依、歸附','歸來','回家'],a:'歸依、歸附'}
];
let state;try{state=JSON.parse(localStorage.getItem('manjingo_progress_cache')||'{}')}catch(e){state={}}
state={totalXp:Number(state.totalXp)||0,todayXp:Number(state.todayXp)||0,streak:Number(state.streak)||0};
function levelInfo(){let level=1,xp=state.totalXp,need=50;while(xp>=need&&level<99){xp-=need;level++;need=50+(level-2)*30}return{level,current:xp,need};}
function save(){try{localStorage.setItem('manjingo_progress_cache',JSON.stringify(state))}catch(e){}}
function render(){const l=levelInfo();document.getElementById('level').textContent=l.level;document.getElementById('xp').textContent='共 '+state.totalXp+' XP';document.getElementById('streak').textContent=state.streak;document.getElementById('daily').textContent=state.todayXp+' / 20 XP';document.getElementById('dailyFill').style.width=Math.min(100,state.todayXp/20*100)+'%';document.getElementById('levelText').textContent=l.current+' / '+l.need+' XP';document.getElementById('levelFill').style.width=Math.min(100,l.current/l.need*100)+'%';}
function normal(v){return String(v||'').replace(/[，。、；：！？\s]/g,'')}
function cloudSubmit(q,correct){return import('./firebase-config.js').then(m=>m.ensureLogin().then(uid=>uid?m.submitAnswer({questionId:q.id,kpId:q.kpId,isCorrect:correct,attemptCount:1,responseTimeMs:0,usedHint:false,localDate:new Date().toLocaleDateString('en-CA')}):null)).catch(function(){return null})}
let index=0;
function finish(){document.getElementById('quiz').innerHTML='<div class="done">🎉 今日學習完成！<br><span class="small">你已完成本次文言文練習。</span></div>';document.getElementById('status').textContent='學習完成，進度已保存在本機。';}
function next(){index++;if(index>=questions.length)return finish();renderQuestion();}
function renderQuestion(){const q=questions[index],box=document.getElementById('quiz');box.innerHTML='<div class="question">'+q.q+'</div><div id="answers"></div><div id="feedback"></div><button class="action" id="next" disabled>下一題</button>';const answers=box.querySelector('#answers');if(q.type==='fill'){answers.innerHTML='<input class="input" id="input" placeholder="請輸入答案"><button class="action" id="check">提交答案</button>';box.querySelector('#check').onclick=function(){answer(box,q,box.querySelector('#input').value)}}else{q.o.forEach(function(x){const b=document.createElement('button');b.className='option';b.textContent=x;b.onclick=function(){answer(box,q,x)};answers.appendChild(b)})}box.querySelector('#next').onclick=next;}
function answer(box,q,value){if(box.dataset.answered)return;box.dataset.answered='1';const correct=normal(value)===normal(q.a);box.querySelectorAll('.option').forEach(function(b){b.disabled=true;if(b.textContent===String(value))b.classList.add(correct?'correct':'wrong')});const fb=box.querySelector('#feedback');fb.className='feedback '+(correct?'correct':'wrong');fb.textContent=correct?'答對了！':'正確答案：'+q.a;if(correct){state.totalXp+=10;state.todayXp+=10;save();render()}cloudSubmit(q,correct).then(function(result){if(result&&typeof result.xpEarned==='number'){state.totalXp=result.totalXp||state.totalXp;state.todayXp=result.todayXp||state.todayXp;save();render();document.getElementById('status').textContent='☁️ 已同步雲端';}});box.querySelector('#next').disabled=false;}
document.getElementById('start').onclick=function(){document.getElementById('plan').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');index=0;renderQuestion()};
render();
})();
</script>
</body>
</html>
