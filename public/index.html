<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSE 文言文自主學習平台</title>
<style>
  body { font-family: "Noto Sans TC", sans-serif; max-width: 640px; margin: 20px auto; background:#f7f6f2; color:#333; padding: 0 16px; }
  h1.main-title { text-align:center; font-size:20px; color:#1cb0f6; margin: 8px 0 16px; }

  .top-bar { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:#fff; border-radius:16px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .level-badge { display:flex; align-items:center; gap:8px; }
  .level-circle { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#1cb0f6,#58cc02); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:15px; }
  .streak-display { display:flex; align-items:center; gap:4px; font-weight:bold; color:#ff9600; }
  .freeze-count { font-size:12px; color:#4aa8ff; margin-left:4px; }
  .xp-total { font-size:13px; color:#999; }

  .daily-goal-card, .level-progress-card { background:#fff; border-radius:16px; padding:16px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .daily-goal-label, .level-progress-label { display:flex; justify-content:space-between; font-size:13px; color:#666; margin-bottom:6px; }
  .daily-bar { height:12px; background:#e0e0e0; border-radius:8px; overflow:hidden; }
  .daily-bar-fill { height:100%; background:linear-gradient(90deg,#58cc02,#8ee000); border-radius:8px; transition: width .4s; }
  .level-bar { height:10px; background:#e0e0e0; border-radius:6px; overflow:hidden; }
  .level-bar-fill { height:100%; background:linear-gradient(90deg,#1cb0f6,#7bd4ff); border-radius:6px; transition: width .4s; }

  .sync-status { font-size:11px; text-align:center; color:#aaa; margin-bottom:10px; }

  .card { background:#fff; border-radius:16px; padding:22px; box-shadow:0 2px 8px rgba(0,0,0,0.08); margin-bottom:20px; }
  .tag { display:inline-block; background:#e8f4ff; color:#1cb0f6; font-size:12px; padding:2px 8px; border-radius:8px; margin-bottom:8px; }
  .question { font-size:18px; margin-bottom:16px; line-height:1.6; margin-top:0; color:#333; }
  .option { display:block; width:100%; padding:12px; margin-bottom:10px; border:2px solid #e0e0e0; border-radius:12px; background:#fff; cursor:pointer; font-size:16px; text-align:left; }
  .option:hover { border-color:#1cb0f6; }
  .option.correct { border-color:#58cc02; background:#d7ffb8; }
  .option.wrong { border-color:#ff4b4b; background:#ffdfe0; }
  .feedback { margin-top:16px; padding:12px; border-radius:10px; font-weight:bold; }
  .feedback.correct { background:#d7ffb8; color:#2b7a00; }
  .feedback.wrong { background:#ffdfe0; color:#c40000; }
  button.next-btn, button.check-btn { margin-top:16px; width:100%; padding:14px; background:#58cc02; color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:bold; cursor:pointer; }
  button.next-btn:disabled { background:#ccc; cursor:not-allowed; }

  .word-bank { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; min-height:44px; padding:8px; background:#f0f0f0; border-radius:10px; }
  .word-tile { padding:8px 14px; background:#1cb0f6; color:#fff; border-radius:8px; cursor:pointer; font-size:16px; user-select:none; }
  .drop-zone { display:flex; flex-wrap:wrap; gap:8px; min-height:44px; padding:8px; border:2px dashed #ccc; border-radius:10px; margin-bottom:10px; }
  .drop-zone .word-tile { background:#58cc02; }

  .match-container { display:flex; gap:20px; }
  .match-col { flex:1; }
  .match-item { padding:10px; margin:6px 0; border:2px solid #e0e0e0; border-radius:10px; cursor:pointer; text-align:center; font-size:15px; }
  .match-item.selected { border-color:#1cb0f6; background:#e8f4ff; }
  .match-item.matched { border-color:#58cc02; background:#d7ffb8; cursor:default; }

  input.fill-input { padding:8px 12px; border:2px solid #e0e0e0; border-radius:8px; font-size:16px; width:160px; }

  .mark-char { cursor:pointer; padding:4px 2px; font-size:18px; }

  .levelup-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; z-index: 999; }
  .levelup-modal { background:#fff; border-radius:20px; padding:40px 30px; text-align:center; animation: popIn 0.4s ease-out; max-width: 320px; }
  @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .levelup-circle { width:100px; height:100px; border-radius:50%; background: linear-gradient(135deg,#ffc800,#ff9600); display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:bold; color:#fff; margin:0 auto 16px; box-shadow: 0 0 0 8px rgba(255,200,0,0.2); }
  .levelup-title { font-size:22px; font-weight:bold; color:#333; margin-bottom:8px; }
  .levelup-sub { font-size:14px; color:#777; margin-bottom:20px; }
  .levelup-close { padding:12px 32px; background:#58cc02; color:#fff; border:none; border-radius:12px; font-size:15px; font-weight:bold; cursor:pointer; }

  .streak-toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #ff9600; color:#fff; padding:10px 20px; border-radius:20px; font-weight:bold; box-shadow:0 4px 12px rgba(0,0,0,.2); display:none; z-index: 998; }

  .no-more { text-align:center; color:#999; padding:20px; }
</style>
</head>
<body>

<h1 class="main-title">DSE 文言文自主學習平台</h1>
<div class="sync-status" id="syncStatus">連接中...</div>

<div class="top-bar">
  <div class="level-badge">
    <div class="level-circle" id="levelCircle">1</div>
    <div class="xp-total" id="xpTotalText">共 0 XP</div>
  </div>
  <div class="streak-display">
    🔥 <span id="streakCount">0</span> 日
    <span class="freeze-count" id="freezeCount">❄️×2</span>
  </div>
</div>

<div class="daily-goal-card">
  <div class="daily-goal-label"><span>今日目標</span><span id="dailyGoalText">0 / 20 XP</span></div>
  <div class="daily-bar"><div class="daily-bar-fill" id="dailyBarFill" style="width:0%;"></div></div>
</div>

<div class="level-progress-card">
  <div class="level-progress-label"><span>等級進度</span><span id="levelProgressText">0 / 50 XP</span></div>
  <div class="level-bar"><div class="level-bar-fill" id="levelBarFill" style="width:0%;"></div></div>
</div>

<div class="card" id="quizCard">
  <div id="quizContent"></div>
</div>

<div class="streak-toast" id="streakToast">🔥 連續學習日 +1！</div>

<div class="levelup-overlay" id="levelupOverlay">
  <div class="levelup-modal">
    <div class="levelup-circle" id="levelupCircle">2</div>
    <div class="levelup-title">升級了！</div>
    <div class="levelup-sub" id="levelupSub">你已達到 Lv.2</div>
    <button class="levelup-close" id="levelupCloseBtn">繼續學習</button>
  </div>
</div>

<script type="module">
import { manager, getLevelFromTotalXp } from "./levelSystem.js";
import { ensureLogin, fetchAllQuestions, fetchUserProgress, saveUserProgress, logAnswerEvent } from "./firebase-config.js";

const fallbackQuestions = [
  { id:"q001", type:"choice", kpId:"kp_yueyang_001", question:"『謫守巴陵郡』中『謫』字的意思是？", options:["提拔","貶官","辭職","退休"], answer:"貶官", xp:8 },
  { id:"q004", type:"choice", kpId:"kp_virtual_zhi", question:"『輟耕之壟上』中『之』字的用法是？", options:["代詞","結構助詞(的)","動詞(到/往)","語氣助詞"], answer:"動詞(到/往)", xp:8 },
  { id:"q005", type:"choice", kpId:"sx_001", question:"『廉頗者，趙之良將也』屬於哪種句式？", options:["判斷句","被動句","省略句","倒裝句"], answer:"判斷句", xp:8 },
  { id:"q006", type:"reorder", kpId:"sx_006", question:"將詞塊排成正確語序（岳陽樓記）", options:["吾","誰","與","歸"], answer:["吾","誰","與","歸"], xp:10 },
  { id:"q007", type:"match", kpId:"kp_virtual_zhi", question:"將「之」的用法與例句配對",
    options:[["之(動詞：到/往)","輟耕之壟上"],["之(代詞：他)","公與之乘"],["之(結構助詞：的)","三里之城"]], xp:5 },
  { id:"q008", type:"fill", kpId:"kp_yueyang_004", question:"先天下之憂而憂，____________。", answer:"後天下之樂而樂", xp:10 },
  { id:"q010", type:"choice", kpId:"sx_006", question:"『微斯人，吾誰與歸』的正確白話翻譯是？",
    options:["如果沒有這樣的人，我要跟從誰呢？","如果沒有這樣的人，誰會跟從我呢？","沒有這樣的人，我不知道去哪裡。","這個人不存在，我們一起回去。"],
    answer:"如果沒有這樣的人，我要跟從誰呢？", xp:8 },
  { id:"q011", type:"mark", kpId:"cy_004", question:"點擊句中活用的字：先天下之憂而憂，後天下之樂而樂",
    options:["先","天","下","之","憂","而","憂","，","後","天","下","之","樂","而","樂"], answer:[0,8], xp:5 }
];

function normalizeQuestion(raw) {
  const q = { ...raw };
  if (q.type === "choice") {
    q.options = Array.isArray(q.options) ? q.options : (q.options || "").split("|");
  } else if (q.type === "reorder") {
    const arr = Array.isArray(q.options) ? q.options : (q.options || "").split("|");
    q.options = [...arr].sort(() => Math.random() - 0.5);
    q.answer = Array.isArray(q.answer) ? q.answer : (q.answer || "").split("|");
  } else if (q.type === "match") {
    if (!Array.isArray(q.options)) {
      q.options = (q.options || "").split(";").map(pair => pair.split("|"));
    }
  } else if (q.type === "mark") {
    q.options = Array.isArray(q.options) ? q.options : (q.options || "").split("/");
    q.answer = Array.isArray(q.answer) ? q.answer : (q.answer || "").split("|").map(Number);
  }
  return q;
}

let questions = [];
let currentIndex = 0;

function refreshTopUI() {
  const state = manager.state;
  const levelInfo = manager.getLevelInfo();
  document.getElementById("levelCircle").textContent = levelInfo.level;
  document.getElementById("xpTotalText").textContent = `共 ${state.totalXp} XP`;
  document.getElementById("streakCount").textContent = state.streak;
  document.getElementById("freezeCount").textContent = `❄️×${state.streakFreezes}`;
  document.getElementById("dailyGoalText").textContent = `${state.todayXp} / ${state.dailyGoalXp} XP`;
  document.getElementById("dailyBarFill").style.width = `${Math.min(100, Math.round((state.todayXp / state.dailyGoalXp) * 100))}%`;
  document.getElementById("levelProgressText").textContent = `${levelInfo.currentLevelXp} / ${levelInfo.nextLevelNeeded} XP`;
  document.getElementById("levelBarFill").style.width = `${levelInfo.progressPercent}%`;
}

function showStreakToast() {
  const toast = document.getElementById("streakToast");
  toast.style.display = "block";
  setTimeout(() => { toast.style.display = "none"; }, 2200);
}

function showLevelUp(levelInfo) {
  document.getElementById("levelupCircle").textContent = levelInfo.level;
  document.getElementById("levelupSub").textContent = `你已達到 Lv.${levelInfo.level}`;
  document.getElementById("levelupOverlay").style.display = "flex";
}
document.getElementById("levelupCloseBtn").onclick = () => {
  document.getElementById("levelupOverlay").style.display = "none";
};

function submitAnswer(q, isCorrect, xpOverride) {
  const xpGained = xpOverride !== undefined ? xpOverride : (isCorrect ? (q.xp || 8) : Math.min(2, q.xp || 2));
  const result = manager.recordAnswer({ questionId: q.id, kpId: q.kpId, isCorrect, xpGained });
  refreshTopUI();
  if (result.streakIncreased) showStreakToast();
  if (result.leveledUp) setTimeout(() => showLevelUp(result.levelInfo), 500);
  return xpGained;
}

function renderQuiz() {
  const container = document.getElementById("quizContent");
  container.innerHTML = "";

  if (currentIndex >= questions.length) {
    container.innerHTML = `<div class="no-more">今日題目已完成！明天再來挑戰更多題目 🎉</div>`;
    return;
  }

  const q = normalizeQuestion(questions[currentIndex]);

  if (q.type === "choice") renderChoice(container, q);
  else if (q.type === "reorder") renderReorder(container, q);
  else if (q.type === "match") renderMatch(container, q);
  else if (q.type === "fill") renderFill(container, q);
  else if (q.type === "mark") renderMark(container, q);
  else nextQuestion();
}

function nextQuestion() {
  currentIndex += 1;
  renderQuiz();
}

function renderChoice(container, q) {
  container.innerHTML = `
    <div class="question">${q.question}</div>
    <div id="optWrap"></div>
    <div class="feedback" id="fb"></div>
    <button class="next-btn" id="nextBtn" disabled>下一題</button>
  `;
  const optWrap = container.querySelector("#optWrap");
  q.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = opt;
    btn.onclick = () => {
      optWrap.querySelectorAll(".option").forEach(b => b.onclick = null);
      const correct = opt === q.answer;
      const fb = container.querySelector("#fb");
      const xp = submitAnswer(q, correct);
      if (correct) { btn.classList.add("correct"); fb.className = "feedback correct"; fb.textContent = `答對了！+${xp} XP`; }
      else { btn.classList.add("wrong"); fb.className = "feedback wrong"; fb.textContent = `正確答案：${q.answer}（+${xp} XP）`; }
      container.querySelector("#nextBtn").disabled = false;
    };
    optWrap.appendChild(btn);
  });
  container.querySelector("#nextBtn").onclick = nextQuestion;
}

function renderReorder(container, q) {
  container.innerHTML = `
    <div class="question">${q.question}</div>
    <div class="drop-zone" id="dropZone"></div>
    <div class="word-bank" id="wordBank"></div>
    <button class="check-btn" id="checkBtn">檢查答案</button>
    <div class="feedback" id="fb"></div>
    <button class="next-btn" id="nextBtn" disabled>下一題</button>
  `;
  const bank = container.querySelector("#wordBank");
  const zone = container.querySelector("#dropZone");
  q.options.forEach(word => {
    const tile = document.createElement("div");
    tile.className = "word-tile";
    tile.textContent = word;
    tile.onclick = () => {
      if (tile.parentElement === bank) zone.appendChild(tile);
      else bank.appendChild(tile);
    };
    bank.appendChild(tile);
  });
  container.querySelector("#checkBtn").onclick = () => {
    const current = [...zone.children].map(t => t.textContent);
    const correct = JSON.stringify(current) === JSON.stringify(q.answer);
    const fb = container.querySelector("#fb");
    const xp = submitAnswer(q, correct);
    if (correct) { fb.className = "feedback correct"; fb.textContent = `正確！+${xp} XP`; }
    else { fb.className = "feedback wrong"; fb.textContent = `順序不對，正確語序：${q.answer.join("")}`; }
    container.querySelector("#nextBtn").disabled = false;
  };
  container.querySelector("#nextBtn").onclick = nextQuestion;
}

function renderMatch(container, q) {
  container.innerHTML = `
    <div class="question">${q.question}</div>
    <div class="match-container"><div class="match-col" id="mLeft"></div><div class="match-col" id="mRight"></div></div>
    <div class="feedback" id="fb"></div>
    <button class="next-btn" id="nextBtn" disabled>下一題</button>
  `;
  const left = container.querySelector("#mLeft");
  const right = container.querySelector("#mRight");
  const shuffledRight = [...q.options].sort(() => Math.random() - 0.5);
  let selectedLeft = null;
  let matchedCount = 0;

  function selectItem(item) {
    if (item.classList.contains("matched")) return;
    if (!selectedLeft) { selectedLeft = item; item.classList.add("selected"); return; }
    const a = selectedLeft, b = item;
    const correct = a.dataset.match === b.textContent || b.dataset.match === a.textContent;
    const fb = container.querySelector("#fb");
    if (correct) {
      a.classList.remove("selected"); a.classList.add("matched"); b.classList.add("matched");
      matchedCount++;
      const xp = submitAnswer(q, true, q.xp);
      fb.className = "feedback correct"; fb.textContent = `配對正確！+${xp} XP`;
      if (matchedCount === q.options.length) container.querySelector("#nextBtn").disabled = false;
    } else {
      a.classList.remove("selected");
      fb.className = "feedback wrong"; fb.textContent = "配對錯誤，再試一次";
    }
    selectedLeft = null;
  }

  q.options.forEach(pair => {
    const item = document.createElement("div");
    item.className = "match-item"; item.textContent = pair[0]; item.dataset.match = pair[1];
    item.onclick = () => selectItem(item);
    left.appendChild(item);
  });
  shuffledRight.forEach(pair => {
    const item = document.createElement("div");
    item.className = "match-item"; item.textContent = pair[1]; item.dataset.match = pair[0];
    item.onclick = () => selectItem(item);
    right.appendChild(item);
  });
  container.querySelector("#nextBtn").onclick = nextQuestion;
}

function renderFill(container, q) {
  container.innerHTML = `
    <div class="question">${q.question.replace("____________", "")}</div>
    <input type="text" class="fill-input" id="fillInput" placeholder="請輸入">
    <button class="check-btn" id="checkBtn">提交</button>
    <div class="feedback" id="fb"></div>
    <button class="next-btn" id="nextBtn" disabled>下一題</button>
  `;
  function normalize(str) { return str.replace(/[，。、；：！？\s]/g, ""); }
  container.querySelector("#checkBtn").onclick = () => {
    const input = container.querySelector("#fillInput").value;
    const correct = normalize(input) === normalize(q.answer);
    const fb = container.querySelector("#fb");
    const xp = submitAnswer(q, correct);
    if (correct) { fb.className = "feedback correct"; fb.textContent = `默寫正確！+${xp} XP`; }
    else { fb.className = "feedback wrong"; fb.textContent = `正確答案：${q.answer}`; }
    container.querySelector("#nextBtn").disabled = false;
  };
  container.querySelector("#nextBtn").onclick = nextQuestion;
}

function renderMark(container, q) {
  container.innerHTML = `
    <div class="question">${q.question}</div>
    <div id="sentence"></div>
    <div class="feedback" id="fb"></div>
    <button class="next-btn" id="nextBtn" disabled>下一題</button>
  `;
  const sentence = container.querySelector("#sentence");
  let foundCount = 0;
  q.options.forEach((ch, i) => {
    const span = document.createElement("span");
    span.className = "mark-char";
    span.textContent = ch;
    span.onclick = () => {
      const fb = container.querySelector("#fb");
      if (q.answer.includes(i) && span.dataset.found !== "1") {
        span.style.background = "#d7ffb8";
        span.dataset.found = "1";
        foundCount++;
        const xp = submitAnswer(q, true, q.xp);
        fb.className = "feedback correct"; fb.textContent = `「${ch}」活用正確！+${xp} XP`;
        if (foundCount === q.answer.length) container.querySelector("#nextBtn").disabled = false;
      } else if (!q.answer.includes(i)) {
        span.style.background = "#ffdfe0";
        fb.className = "feedback wrong"; fb.textContent = "這個字沒有活用，再找找看";
      }
    };
    sentence.appendChild(span);
  });
  container.querySelector("#nextBtn").onclick = nextQuestion;
}

async function init() {
  const syncEl = document.getElementById("syncStatus");
  let userId = null;
  let cloudState = null;

  try {
    userId = await ensureLogin();
    if (userId) {
      cloudState = await fetchUserProgress(userId);
      const remoteQuestions = await fetchAllQuestions();
      if (remoteQuestions && remoteQuestions.length) questions = remoteQuestions;
      syncEl.textContent = "☁️ 已連接雲端，進度自動保存";
    } else {
      syncEl.textContent = "⚠️ 離線模式，進度只保存在此裝置";
    }
  } catch (e) {
    console.warn("Firebase 連接失敗，使用離線模式", e);
    syncEl.textContent = "⚠️ 離線模式，進度只保存在此裝置";
  }

  if (!questions.length) questions = fallbackQuestions;

  await manager.init(userId, cloudState, saveUserProgress, logAnswerEvent);
  refreshTopUI();
  renderQuiz();
}

init();
</script>

</body>
</html>
