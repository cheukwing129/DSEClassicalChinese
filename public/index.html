<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manjingo｜文言文自主學習</title>
<style>
:root{--green:#58cc02;--blue:#1cb0f6;--ink:#000437;--text:#4b4b4b;--gray:#afafaf;--red:#ff4b4b;--light-green:#d7ffb8;--light-red:#ffdfe0;--orange:#ff9600}
*{box-sizing:border-box}body{font-family:"Noto Sans TC",system-ui,sans-serif;max-width:640px;margin:20px auto;padding:0 16px 40px;color:var(--text);background:#fff}button,input{font:inherit}.title{text-align:center;color:var(--green);font-size:34px;margin:16px 0 4px}.status{text-align:center;color:var(--gray);font-size:12px;font-weight:700;margin-bottom:14px}.card{border:2px solid var(--gray);border-radius:20px;padding:16px;margin-bottom:16px;background:#fff}.top{display:flex;justify-content:space-between;align-items:center}.level{display:flex;align-items:center;gap:10px;font-weight:800}.circle{width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center}.streak{font-weight:800;color:var(--orange)}.label{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin:5px 0}.bar{height:13px;background:#e5e5e5;border:2px solid var(--gray);border-radius:10px;overflow:hidden;margin-bottom:12px}.fill{height:100%;background:var(--green);width:0}.plan-title{font-size:24px;font-weight:900;color:var(--ink)}.plan-sub{color:var(--gray);font-weight:700;margin:5px 0 14px}.stats{display:flex;gap:8px;margin-bottom:10px}.stat{flex:1;text-align:center;background:#f5f5f5;border-radius:12px;padding:10px 4px}.stat strong{display:block;color:var(--ink);font-size:18px}.stat span{font-size:12px;font-weight:700}.action,.option{width:100%;padding:14px 16px;border:2px solid var(--green);border-radius:14px;background:var(--green);color:#fff;font-weight:800;cursor:pointer;margin-top:8px}.option{background:#fff;color:var(--text);border-color:var(--gray);text-align:left}.option.correct{background:var(--light-green);border-color:var(--green)}.option.wrong{background:var(--light-red);border-color:var(--red)}.question{font-size:20px;font-weight:800;line-height:1.5;margin-bottom:18px}.feedback{padding:12px;border-radius:12px;font-weight:800;margin-top:10px}.feedback.correct{background:var(--light-green);color:#287400}.feedback.wrong{background:var(--light-red);color:#b00000}.input{width:100%;padding:13px;border:2px solid var(--gray);border-radius:14px}.hidden{display:none}.done{text-align:center;padding:25px 5px;font-weight:800}.small{font-size:12px;color:var(--gray)}.category{display:inline-block;padding:4px 8px;border-radius:8px;background:#eef8e8;color:#398500;font-size:11px;margin-bottom:8px;font-weight:800}
</style>
</head>
<body>
<h1 class="title">Manjingo</h1>
<div class="status" id="status">本地學習模式已準備</div>
<div class="card top"><div class="level"><div class="circle" id="level">1</div><span id="xp">共 0 XP</span></div><div class="streak">🔥 <span id="streak">0</span> 日</div></div>
<div class="card"><div class="label"><span>今日目標</span><span id="daily">0 / 20 XP</span></div><div class="bar"><div class="fill" id="dailyFill"></div></div><div class="label"><span>等級進度</span><span id="levelText">0 / 50 XP</span></div><div class="bar"><div class="fill" id="levelFill"></div></div></div>
<div class="card" id="plan"><div class="plan-title">今日學習</div><div class="plan-sub" id="planSub">準備好了，先用本地題目開始學習。</div><div class="stats"><div class="stat"><strong id="reviewCount">0</strong><span>複習</span></div><div class="stat"><strong id="weakCount">0</strong><span>弱項</span></div><div class="stat"><strong id="newCount">6</strong><span>新知識</span></div></div><button class="action" id="start">開始今日學習</button></div>
<div class="card hidden" id="quiz"></div>
<script>
(function(){
'use strict';
const localQuestions=[
{id:'q001',kpId:'kp_yueyang_001',type:'choice',q:'『謫守巴陵郡』中『謫』字的意思是？',o:['提拔','貶官','辭職','退休'],a:'貶官'},
{id:'q004',kpId:'kp_virtual_zhi',type:'choice',q:'『輟耕之壟上』中『之』字的用法是？',o:['代詞','結構助詞（的）','動詞（到／往）','語氣助詞'],a:'動詞（到／往）'},
{id:'q005',kpId:'sx_001',type:'choice',q:'『廉頗者，趙之良將也』屬於哪種句式？',o:['判斷句','被動句','省略句','倒裝句'],a:'判斷句'},
{id:'q010',kpId:'sx_006',type:'choice',q:'『微斯人，吾誰與歸』的正確白話翻譯是？',o:['如果沒有這樣的人，我要跟從誰呢？','如果沒有這樣的人，誰會跟從我呢？','沒有這樣的人，我不知道去哪裡。','這個人不存在，我們一起回去。'],a:'如果沒有這樣的人，我要跟從誰呢？'},
{id:'q008',kpId:'kp_yueyang_004',type:'fill',q:'先天下之憂而憂，____________。',a:'後天下之樂而樂'},
{id:'q006',kpId:'sx_006',type:'choice',q:'『吾誰與歸』中『歸』的意思是？',o:['歸還','歸依、歸附','歸來','回家'],a:'歸依、歸附'}
];
let questions=localQuestions.slice(), planItems=[], index=0, state={};
try{state=JSON.parse(localStorage.getItem('manjingo_progress_cache')||'{}')}catch(e){state={}}
state={totalXp:Number(state.totalXp)||0,todayXp:Number(state.todayXp)||0,streak:Number(state.streak)||0};
function levelInfo(){let level=1,xp=state.totalXp,need=50;while(xp>=need&&level<99){xp-=need;level++;need=50+(level-2)*30}return{level,current:xp,need};}
function save(){try{localStorage.setItem('manjingo_progress_cache',JSON.stringify(state))}catch(e){}}
function render(){const l=levelInfo();document.getElementById('level').textContent=l.level;document.getElementById('xp').textContent='共 '+state.totalXp+' XP';document.getElementById('streak').textContent=state.streak;document.getElementById('daily').textContent=state.todayXp+' / 20 XP';document.getElementById('dailyFill').style.width=Math.min(100,state.todayXp/20*100)+'%';document.getElementById('levelText').textContent=l.current+' / '+l.need+' XP';document.getElementById('levelFill').style.width=Math.min(100,l.current/l.need*100)+'%';}
function normal(v){return String(v||'').replace(/[，。、；：！？\s]/g,'')}
function cloudModule(){return import('./firebase-config.js')}
function cloudSubmit(q,correct,answerId){return cloudModule().then(m=>m.ensureLogin().then(uid=>uid?m.submitAnswer({answerId:answerId,questionId:q.id,kpId:q.kpId,isCorrect:correct,attemptCount:1,responseTimeMs:0,usedHint:false,localDate:new Date().toLocaleDateString('en-CA')}):null)).catch(function(){return null})}
function createAnswerId(){try{if(window.crypto&&typeof window.crypto.randomUUID==='function')return window.crypto.randomUUID().replace(/-/g,'');}catch(e){}return 'ans_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,14);}
function parseQuestion(raw){
 if(!raw||!raw.id||!raw.kpId)return null;
 const q={...raw,id:String(raw.id),kpId:String(raw.kpId)};
 const options=Array.isArray(q.o)?q.o:(Array.isArray(q.options)?q.options:(Array.isArray(q.choices)?q.choices:null));
 const answer=q.a??q.answer??q.correctAnswer??q.correct;
 const type=String(q.type||'').toLowerCase().replace(/[-_\s]/g,'');
 const fillTypes=['fill','input','text','textinput','shortanswer'];
 const choiceTypes=['choice','multiplechoice','mcq','singlechoice','singleanswer'];
 if(fillTypes.includes(type)){if(answer==null||!q.q)return null;q.type='fill';q.a=String(answer);return q;}
 if(options&&options.length){if(answer==null||!q.q)return null;q.type='choice';q.o=options.map(String);q.a=String(answer);return q;}
 if(choiceTypes.includes(type)||!type)return null;
 if(q.q&&answer!=null){q.a=String(answer);return q;}
 return null;
}
function showPlan(items,source){planItems=items;const review=items.filter(x=>x.category==='review').length,weak=items.filter(x=>x.category==='weak').length,news=items.filter(x=>x.category==='new').length;document.getElementById('reviewCount').textContent=review;document.getElementById('weakCount').textContent=weak;document.getElementById('newCount').textContent=news;document.getElementById('planSub').textContent=source==='cloud'?'今日計劃已根據你的掌握度安排：複習 → 弱項 → 新知識。':'雲端未連線，先用本地題目開始學習。';document.getElementById('status').textContent=source==='cloud'?'☁️ 已載入今日學習計劃':'本地學習模式已準備';}
async function loadCloudPlan(){
try{
 const m=await cloudModule();const uid=await m.ensureLogin();if(!uid)return;
 const [remotePlan,remoteQuestions]=await Promise.all([m.getDailyLearningPlan(),m.fetchAllQuestions()]);
 const parsed=remoteQuestions.map(parseQuestion).filter(Boolean);const byKp=new Map();parsed.forEach(q=>{if(!byKp.has(q.kpId))byKp.set(q.kpId,[]);byKp.get(q.kpId).push(q)});
 const selected=[];(remotePlan.items||[]).forEach(item=>{const matches=byKp.get(item.kpId)||[];matches.forEach(q=>{if(selected.length<10)selected.push({...q,category:item.category,priority:item.priority});});});
 if(selected.length){questions=selected;showPlan(remotePlan.items||[],'cloud');}
 const game=await m.fetchUserGamification(uid);if(game){state.totalXp=Number(game.totalXp)||state.totalXp;state.todayXp=Number(game.todayXp)||0;state.streak=Number(game.streak)||0;save();render();}
}catch(e){console.warn('daily plan unavailable; keeping local mode',e)}
}
function finish(){document.getElementById('quiz').innerHTML='<div class="done">🎉 今日學習完成！<br><span class="small">你已完成本次文言文練習。</span></div>';document.getElementById('status').textContent='學習完成';}
function next(){index++;if(index>=questions.length)return finish();renderQuestion();}
function renderQuestion(){const q=questions[index],box=document.getElementById('quiz');box.innerHTML='<div class="category">'+(q.category==='review'?'複習':q.category==='weak'?'弱項':'新知識')+' · '+(index+1)+' / '+questions.length+'</div><div class="question">'+q.q+'</div><div id="answers"></div><div id="feedback"></div><button class="action" id="next" disabled>下一題</button>';const answers=box.querySelector('#answers');const options=Array.isArray(q.o)?q.o:[];if(q.type==='fill'){answers.innerHTML='<input class="input" id="input" placeholder="請輸入答案"><button class="action" id="check">提交答案</button>';box.querySelector('#check').onclick=function(){answer(box,q,box.querySelector('#input').value)}}else if(options.length){options.forEach(function(x){const b=document.createElement('button');b.className='option';b.textContent=x;b.onclick=function(){answer(box,q,x)};answers.appendChild(b)})}else{answers.innerHTML='<div class="feedback wrong">這題資料不完整，已跳過。</div>';box.querySelector('#next').disabled=false}box.querySelector('#next').onclick=next;}
function answer(box,q,value){if(box.dataset.answered)return;box.dataset.answered='1';const answerId=createAnswerId();box.dataset.answerId=answerId;const correct=normal(value)===normal(q.a);box.querySelectorAll('.option').forEach(function(b){b.disabled=true;if(b.textContent===String(value))b.classList.add(correct?'correct':'wrong')});const fb=box.querySelector('#feedback');fb.className='feedback '+(correct?'correct':'wrong');fb.textContent=correct?'答對了！':'正確答案：'+q.a;if(correct){state.totalXp+=10;state.todayXp+=10;save();render()}cloudSubmit(q,correct,answerId).then(function(result){if(result&&typeof result.xpEarned==='number'){state.totalXp=result.totalXp||state.totalXp;state.todayXp=result.todayXp||state.todayXp;state.streak=result.streak||state.streak;save();render();document.getElementById('status').textContent=result.duplicate?'☁️ 答案已存在，沒有重複計分':'☁️ 已同步雲端';}});box.querySelector('#next').disabled=false;}
document.getElementById('start').onclick=function(){document.getElementById('plan').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');index=0;renderQuestion()};
render();showPlan(localQuestions.map((q,i)=>({kpId:q.kpId,category:'new',priority:60})), 'local');void loadCloudPlan();
})();
</script>
</body>
</html>
