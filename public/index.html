<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manjingo｜文言文自主學習</title>
<style>
:root{--green:#58cc02;--ink:#000437;--text:#4b4b4b;--gray:#afafaf;--red:#ff4b4b;--light-green:#d7ffb8;--light-red:#ffdfe0;--orange:#ff9600}
*{box-sizing:border-box}body{font-family:"Noto Sans TC",system-ui,sans-serif;max-width:640px;margin:20px auto;padding:0 16px 40px;color:var(--text);background:#fff}button,input{font:inherit}.title{text-align:center;color:var(--green);font-size:34px;margin:16px 0 4px}.status{text-align:center;color:var(--gray);font-size:12px;font-weight:700;margin-bottom:14px}.card{border:2px solid var(--gray);border-radius:20px;padding:16px;margin-bottom:16px;background:#fff}.top{display:flex;justify-content:space-between;align-items:center}.level{display:flex;align-items:center;gap:10px;font-weight:800}.circle{width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center}.streak{font-weight:800;color:var(--orange)}.label{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin:5px 0}.bar{height:13px;background:#e5e5e5;border:2px solid var(--gray);border-radius:10px;overflow:hidden;margin-bottom:12px}.fill{height:100%;background:var(--green);width:0}.plan-title{font-size:24px;font-weight:900;color:var(--ink)}.plan-sub{color:var(--gray);font-weight:700;margin:5px 0 14px}.stats{display:flex;gap:8px;margin-bottom:10px}.stat{flex:1;text-align:center;background:#f5f5f5;border-radius:12px;padding:10px 4px}.stat strong{display:block;color:var(--ink);font-size:18px}.stat span{font-size:12px;font-weight:700}.action,.option{width:100%;padding:14px 16px;border:2px solid var(--green);border-radius:14px;background:var(--green);color:#fff;font-weight:800;cursor:pointer;margin-top:8px}.option{background:#fff;color:var(--text);border-color:var(--gray);text-align:left}.option.correct{background:var(--light-green);border-color:var(--green)}.option.wrong{background:var(--light-red);border-color:var(--red)}.option:disabled{cursor:default;opacity:1}.action:disabled{cursor:default;opacity:.55}.question{font-size:20px;font-weight:800;line-height:1.5;margin-bottom:18px}.feedback{padding:12px;border-radius:12px;font-weight:800;margin-top:10px}.feedback.correct{background:var(--light-green);color:#287400}.feedback.wrong{background:var(--light-red);color:#b00000}.feedback.info{background:#f5f5f5;color:var(--ink)}.input{width:100%;padding:13px;border:2px solid var(--gray);border-radius:14px}.hidden{display:none}.done{text-align:center;padding:25px 5px;font-weight:800}.small{font-size:12px;color:var(--gray)}.category{display:inline-block;padding:4px 8px;border-radius:8px;background:#eef8e8;color:#398500;font-size:11px;margin-bottom:8px;font-weight:800}.category.misconception{background:#fff3cd;color:#8a5a00}.mastery{margin-top:8px;font-size:13px;font-weight:700}.mastery strong{color:var(--ink)}
</style>
</head>
<body>
<h1 class="title">Manjingo</h1>
<div class="status" id="status">📱 本機學習模式</div>
<div class="card top"><div class="level"><div class="circle" id="level">1</div><span id="xp">共 0 XP</span></div><div class="streak">🔥 <span id="streak">0</span> 日</div></div>
<div class="card"><div class="label"><span>今日目標</span><span id="daily">0 / 20 XP</span></div><div class="bar"><div class="fill" id="dailyFill"></div></div><div class="label"><span>等級進度</span><span id="levelText">0 / 50 XP</span></div><div class="bar"><div class="fill" id="levelFill"></div></div></div>
<div class="card" id="plan"><div class="plan-title">今日學習</div><div class="plan-sub" id="planSub">你的學習進度會保存在這部裝置。</div><div class="stats"><div class="stat"><strong id="reviewCount">0</strong><span>複習</span></div><div class="stat"><strong id="weakCount">0</strong><span>弱項</span></div><div class="stat"><strong id="newCount">5</strong><span>新知識</span></div></div><button class="action" id="start" type="button">開始今日學習</button></div>
<div class="card hidden" id="quiz"></div>
<script src="./content-catalog.js"></script>
<script src="./local-learning.js"></script>
<script>
(function(){
'use strict';
const content=window.ManjingoContent;
const localQuestions=content?content.questions.slice():[];
let questions=localQuestions.slice(),index=0;
function learning(){return window.ManjingoLocalLearning}
function progress(){return learning()?learning().getProgress():{totalXp:0,todayXp:0,streak:0}}
function localDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function levelInfo(totalXp){let level=1,xp=totalXp,need=50;while(xp>=need&&level<99){xp-=need;level++;need=50+(level-2)*30}return{level,current:xp,need};}
function render(){const state=progress(),l=levelInfo(state.totalXp);document.getElementById('level').textContent=l.level;document.getElementById('xp').textContent='共 '+state.totalXp+' XP';document.getElementById('streak').textContent=state.streak;document.getElementById('daily').textContent=state.todayXp+' / 20 XP';document.getElementById('dailyFill').style.width=Math.min(100,state.todayXp/20*100)+'%';document.getElementById('levelText').textContent=l.current+' / '+l.need+' XP';document.getElementById('levelFill').style.width=Math.min(100,l.current/l.need*100)+'%';}
function normal(v){return String(v||'').replace(/[，。、；：！？\s]/g,'')}
function cloudModule(){return import('./firebase-config.js')}
function cloudSubmit(q,correct,answerId){return cloudModule().then(m=>m.ensureLogin().then(uid=>uid?m.submitAnswer({answerId:answerId,questionId:q.id,kpId:q.kpId,isCorrect:correct,attemptCount:1,responseTimeMs:0,usedHint:false,localDate:localDate()}):null));}
function createAnswerId(){try{if(window.crypto&&typeof window.crypto.randomUUID==='function')return window.crypto.randomUUID().replace(/-/g,'');}catch(e){}return 'ans_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,14);}
function parseQuestion(raw){if(!raw||!raw.id||!raw.kpId)return null;const q={...raw,id:String(raw.id),kpId:String(raw.kpId)};const options=Array.isArray(q.o)?q.o:(Array.isArray(q.options)?q.options:(Array.isArray(q.choices)?q.choices:null));const answer=q.a??q.answer??q.correctAnswer??q.correct;const type=String(q.type||'').toLowerCase().replace(/[-_\s]/g,'');const fillTypes=['fill','input','text','textinput','shortanswer'];if(fillTypes.includes(type)){if(answer==null||!q.q)return null;q.type='fill';q.a=String(answer);return q;}if(options&&options.length){if(answer==null||!q.q)return null;q.type='choice';q.o=options.map(String);q.a=String(answer);return q;}return null;}
function localKnowledgePointIds(){return content?content.getKnowledgePointIds({teachableOnly:true}):Array.from(new Set(localQuestions.map(q=>q.kpId)))}
function buildLocalPlan(){const kpIds=localKnowledgePointIds();const plan=learning()?learning().buildDailyPlan(kpIds,10):{targetCount:kpIds.length,items:kpIds.map(kpId=>({kpId,category:'new',priority:3}))};const selected=content?content.selectQuestionsForPlan(plan,localQuestions,10):localQuestions.slice(0,plan.targetCount||10).map(q=>({...q,category:'new',priority:3}));return{plan,questions:selected};}
function applyLocalPlan(){const built=buildLocalPlan();questions=built.questions;showPlan(built.plan.items||[],'local');}
function showPlan(items,source){const review=items.filter(x=>x.category==='review').length,weak=items.filter(x=>x.category==='weak').length,news=items.filter(x=>x.category==='new').length;document.getElementById('reviewCount').textContent=review;document.getElementById('weakCount').textContent=weak;document.getElementById('newCount').textContent=news;document.getElementById('planSub').textContent=source==='cloud'?'今日計劃已根據你的掌握度安排：複習 → 弱項 → 新知識。':'今日會優先複習到期內容，再安排弱項，最後加入新知識。';document.getElementById('status').textContent=source==='cloud'?'☁️ 已載入今日學習計劃':'📱 本機學習模式';}
async function loadCloudPlan(){try{const m=await cloudModule();const uid=await m.ensureLogin();if(!uid)return;const [remotePlan,remoteQuestions]=await Promise.all([m.getDailyLearningPlan(),m.fetchAllQuestions()]);const parsed=remoteQuestions.map(parseQuestion).filter(Boolean);const selected=content?content.selectQuestionsForPlan(remotePlan,parsed,10):[];if(selected.length){questions=selected;showPlan(remotePlan.items||[],'cloud')}const game=await m.fetchUserGamification(uid);if(game&&learning()){learning().syncGamification(game);render()}}catch(e){console.warn('cloud unavailable; using local learning engine',e)}}
function finish(){document.getElementById('quiz').innerHTML='<div class="done">🎉 今日學習完成！<br><span class="small">你的學習進度已保存在這部裝置。下次會按掌握度重新安排。</span></div>';document.getElementById('status').textContent='📱 今日學習完成';applyLocalPlan();}
function next(){index++;if(index>=questions.length)return finish();renderQuestion();}
function renderQuestion(){const q=questions[index],box=document.getElementById('quiz');box.dataset.answered='';box.dataset.answerId='';const isMisconception=!!q.misconceptionReview;const label=isMisconception?'🔁 錯題重溫':q.category==='review'?'複習':q.category==='weak'?'弱項':'新知識';box.innerHTML='<div class="category'+(isMisconception?' misconception':'')+'">'+label+' · '+(index+1)+' / '+questions.length+'</div><div class="question">'+q.q+'</div><div id="answers"></div><div id="feedback"></div><button class="action" id="next" type="button" disabled>下一題</button>';const answers=box.querySelector('#answers');const options=Array.isArray(q.o)?q.o:[];if(q.type==='fill'){answers.innerHTML='<input class="input" id="input" placeholder="請輸入答案"><button class="action" id="check" type="button">提交答案</button>';box.querySelector('#check').onclick=function(){answer(box,q,box.querySelector('#input').value)}}else if(options.length){options.forEach(function(x){const b=document.createElement('button');b.className='option';b.type='button';b.textContent=x;b.onclick=function(){answer(box,q,x)};answers.appendChild(b)})}else{answers.innerHTML='<div class="feedback wrong">這題資料不完整，已跳過。</div>';box.querySelector('#next').disabled=false}box.querySelector('#next').onclick=next;}
function showLearningFeedback(box,q,correct,result){const fb=box.querySelector('#feedback');let html=correct?'答對了！':'正確答案：'+q.a;if(correct&&q.misconceptionReview&&result&&Number(result.resolvedMisconceptions)>0){html+='<div class="mastery">✅ 你已修正這個錯誤模式。</div>';if(Number(result.remainingMisconceptionWeight)>0)html+='<div class="mastery">🔁 這題仍會保留較低的複習權重，直到穩定答對。</div>';}if(result&&typeof result.mastery==='number'){const statusMap={unlearned:'尚未掌握',learning:'正在學習',unstable:'掌握不穩定',familiar:'基本熟悉',stable:'掌握穩定',mastered:'已掌握'};html+='<div class="mastery">🧠 掌握度：<strong>'+result.mastery+'%</strong> · '+(statusMap[result.status]||result.status||'學習中')+'</div>';if(result.nextReviewAt){const d=result.nextReviewAt._seconds?new Date(result.nextReviewAt._seconds*1000):new Date(result.nextReviewAt);if(!Number.isNaN(d.getTime()))html+='<div class="mastery">📅 建議下次複習：'+d.toLocaleDateString('zh-Hant-TW')+'</div>'}if(typeof result.xpEarned==='number')html+='<div class="mastery">⭐ 本題獲得：'+result.xpEarned+' XP</div>'}fb.className='feedback '+(correct?'correct':'wrong');fb.innerHTML=html;}
async function answer(box,q,value){if(box.dataset.answered)return;box.dataset.answered='1';const answerId=createAnswerId();box.dataset.answerId=answerId;const correct=normal(value)===normal(q.a);box.querySelectorAll('.option').forEach(function(b){b.disabled=true;if(b.textContent===String(value))b.classList.add(correct?'correct':'wrong')});const nextButton=box.querySelector('#next');nextButton.disabled=true;try{const result=await cloudSubmit(q,correct,answerId);if(result&&result.success){const synced=learning()?learning().syncRemoteResult(q.kpId,result):result;const repair=correct&&learning()?learning().resolveQuestionMisconceptions(q.kpId,q.id):{resolvedMisconceptions:0,remainingMisconceptionWeight:0};render();showLearningFeedback(box,q,correct,{...result,...synced,...repair});document.getElementById('status').textContent=result.duplicate?'☁️ 答案已存在，沒有重複計分':'☁️ 已同步學習進度';nextButton.disabled=false;return}}catch(e){console.warn('cloud answer unavailable; switching to local',e)}const localResult=learning()?learning().submit(q.kpId,correct,{questionId:q.id,selectedAnswer:value,correctAnswer:q.a}):null;render();showLearningFeedback(box,q,correct,localResult);document.getElementById('status').textContent=correct?'📱 已記錄：掌握度已更新':'📱 已記錄：這個知識點會優先複習';applyLocalPlan();nextButton.disabled=false;}
document.getElementById('start').onclick=function(){document.getElementById('plan').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');index=0;if(!questions.length)questions=buildLocalPlan().questions;if(!questions.length){finish();return}renderQuestion()};
render();applyLocalPlan();void loadCloudPlan();
})();
</script>
</body>
</html>
