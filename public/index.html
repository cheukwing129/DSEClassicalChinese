<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manjingo｜文言文自主學習</title>
<style>
:root{--green:#58cc02;--light-green:#d7ffb8;--blue:#1cb0f6;--ink:#000437;--text:#4b4b4b;--gray:#afafaf;--red:#ff4b4b;--light-red:#ffdfe0;--gold:#ffc800;--orange:#ff9600;--radius:14px;--lg:20px}
*{box-sizing:border-box}body{font-family:'Noto Sans TC',system-ui,sans-serif;max-width:640px;margin:20px auto;padding:0 16px 40px;color:var(--text);background:#fff}button,input{font:inherit}.main-title{text-align:center;color:var(--green);font-size:34px;margin:16px 0}.sync-status{text-align:center;color:var(--gray);font-size:12px;font-weight:700;margin-bottom:12px}.top-bar,.progress-card,.quiz-card,.daily-card{border:2px solid var(--gray);border-radius:var(--lg);padding:16px;margin-bottom:16px;background:#fff}.top-bar{display:flex;justify-content:space-between;align-items:center}.level-badge{display:flex;align-items:center;gap:10px}.level-circle{width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800}.xp-total,.streak{font-weight:800}.streak{color:var(--orange)}.freeze{font-size:12px;color:var(--blue);margin-left:5px}.progress-label{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:7px}.bar{height:13px;background:#e5e5e5;border-radius:10px;overflow:hidden;border:2px solid var(--gray);margin-bottom:12px}.fill{height:100%;background:var(--green);transition:width .35s}.level-fill{background:var(--blue)}.daily-plan-title{font-size:24px;font-weight:900;color:var(--ink)}.daily-plan-subtitle{margin:4px 0 14px;color:var(--gray);font-weight:700}.daily-plan-stats{display:flex;gap:8px;margin-bottom:10px}.daily-plan-stat{flex:1;text-align:center;padding:11px 5px;border-radius:12px;background:#f5f5f5}.daily-plan-stat strong{display:block;font-size:18px;color:var(--ink)}.daily-plan-stat span{font-size:12px;font-weight:700}.daily-start{text-align:center!important}.question{font-size:20px;font-weight:800;line-height:1.5;margin-bottom:20px}.option,.action{width:100%;padding:14px 16px;border:2px solid var(--gray);border-radius:var(--radius);background:#fff;color:var(--text);font-weight:700;text-align:left;cursor:pointer;margin-bottom:10px}.option:hover{border-color:var(--blue);background:#f0faff}.option.correct{border-color:var(--green);background:var(--light-green)}.option.wrong{border-color:var(--red);background:var(--light-red)}.action{background:var(--green);color:#fff;text-align:center;border-color:var(--green);margin-top:10px}.action:disabled{background:#e5e5e5;color:var(--gray);border-color:#e5e5e5;cursor:not-allowed}.feedback{padding:13px 15px;border-radius:var(--radius);font-weight:800;margin-top:12px}.feedback.correct{background:var(--light-green);color:#2b7a00}.feedback.wrong{background:var(--light-red);color:#c40000}.word-bank,.drop-zone{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border:2px solid var(--gray);border-radius:var(--radius);min-height:52px;margin-bottom:12px}.drop-zone{border-style:dashed}.word-tile{padding:9px 13px;background:var(--blue);color:#fff;border-radius:10px;border:2px solid var(--ink);cursor:pointer;font-weight:700}.drop-zone .word-tile{background:var(--green)}.match-container{display:flex;gap:14px}.match-col{flex:1}.match-item{padding:11px 8px;border:2px solid var(--gray);border-radius:10px;margin:8px 0;text-align:center;font-weight:700;cursor:pointer}.match-item.selected{border-color:var(--blue);background:#e8f4ff}.match-item.matched{border-color:var(--green);background:var(--light-green);cursor:default}.fill-input{width:100%;padding:13px;border:2px solid var(--gray);border-radius:var(--radius);margin-bottom:10px}.mark-char{display:inline-block;padding:6px 3px;font-size:20px;cursor:pointer;border-radius:6px}.no-more{text-align:center;padding:30px 10px;font-weight:800}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--orange);color:#fff;padding:12px 22px;border:2px solid var(--ink);border-radius:var(--lg);font-weight:800;display:none;z-index:5}.levelup{position:fixed;inset:0;background:rgba(0,4,55,.6);display:none;align-items:center;justify-content:center;z-index:10}.levelup-box{background:#fff;border:2px solid var(--ink);border-radius:var(--lg);padding:35px;text-align:center}.levelup-num{width:90px;height:90px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;margin:0 auto 15px}
</style>
</head>
<body>
<h1 class="main-title">Manjingo</h1>
<div class="sync-status" id="syncStatus">正在載入本地學習內容…</div>
<div class="top-bar"><div class="level-badge"><div class="level-circle" id="levelCircle">1</div><div class="xp-total" id="xpTotalText">共 0 XP</div></div><div class="streak">🔥 <span id="streakCount">0</span> 日 <span class="freeze" id="freezeCount">❄️×2</span></div></div>
<div class="progress-card"><div class="progress-label"><span>今日目標</span><span id="dailyGoalText">0 / 20 XP</span></div><div class="bar"><div class="fill" id="dailyBarFill" style="width:0"></div></div><div class="progress-label"><span>等級進度</span><span id="levelProgressText">0 / 50 XP</span></div><div class="bar"><div class="fill level-fill" id="levelBarFill" style="width:0"></div></div></div>
<div class="daily-card" id="dailyPlanCard"><div class="daily-plan-title">今日學習</div><div class="daily-plan-subtitle">準備好了，先用本地題目開始學習。</div></div>
<div class="quiz-card" id="quizCard" style="display:none"><div id="quizContent"></div></div>
<div class="toast" id="toast">🔥 連續學習日 +1！</div>
<div class="levelup" id="levelup"><div class="levelup-box"><div class="levelup-num" id="levelupNum">2</div><h2>升級了！</h2><p id="levelupText">你已達到 Lv.2</p><button class="action" id="levelupClose">繼續學習</button></div></div>
<script type="module">
import { manager } from './levelSystem.js';
import { ensureLogin, fetchAllQuestions, fetchUserGamification, submitAnswer } from './firebase-config.js';
import { loadDailyPlan, buildDailyQueue, renderDailyPlanCard } from './dailyPlan.js';

const fallbackQuestions=[{id:'q001',type:'choice',kpId:'kp_yueyang_001',question:'『謫守巴陵郡』中『謫』字的意思是？',options:['提拔','貶官','辭職','退休'],answer:'貶官'},{id:'q004',type:'choice',kpId:'kp_virtual_zhi',question:'『輟耕之壟上』中『之』字的用法是？',options:['代詞','結構助詞（的）','動詞（到／往）','語氣助詞'],answer:'動詞（到／往）'},{id:'q005',type:'choice',kpId:'sx_001',question:'『廉頗者，趙之良將也』屬於哪種句式？',options:['判斷句','被動句','省略句','倒裝句'],answer:'判斷句'},{id:'q010',type:'choice',kpId:'sx_006',question:'『微斯人，吾誰與歸』的正確白話翻譯是？',options:['如果沒有這樣的人，我要跟從誰呢？','如果沒有這樣的人，誰會跟從我呢？','沒有這樣的人，我不知道去哪裡。','這個人不存在，我們一起回去。'],answer:'如果沒有這樣的人，我要跟從誰呢？'},{id:'q008',type:'fill',kpId:'kp_yueyang_004',question:'先天下之憂而憂，____________。',answer:'後天下之樂而樂'},{id:'q006',type:'reorder',kpId:'sx_006',question:'將詞塊排成正確語序（岳陽樓記）',options:['吾','誰','與','歸'],answer:['吾','誰','與','歸']}];
const localPlan=()=>({targetCount:Math.min(10,fallbackQuestions.length),items:fallbackQuestions.map(q=>({kpId:q.kpId,category:'mixed',priority:40})),review:[],weak:[],newKnowledgePoints:fallbackQuestions.map(q=>q.kpId),totalRecommended:fallbackQuestions.length});
let questions=[...fallbackQuestions];let currentIndex=0;let currentStartedAt=Date.now();let attemptCount=1;let submitting=false;let dailyPlan=localPlan();
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function refreshTopUI(){const s=manager.state;const li=manager.getLevelInfo();document.getElementById('levelCircle').textContent=li.level;document.getElementById('xpTotalText').textContent=`共 ${s.totalXp||0} XP`;document.getElementById('streakCount').textContent=s.streak||0;document.getElementById('freezeCount').textContent=`❄️×${s.streakFreezes??2}`;const goal=s.dailyGoalXp||20;document.getElementById('dailyGoalText').textContent=`${s.todayXp||0} / ${goal} XP`;document.getElementById('dailyBarFill').style.width=`${Math.min(100,Math.round(((s.todayXp||0)/goal)*100))}%`;document.getElementById('levelProgressText').textContent=`${li.currentLevelXp} / ${li.nextLevelNeeded} XP`;document.getElementById('levelBarFill').style.width=`${li.progressPercent}%`}
function toast(){const el=document.getElementById('toast');el.style.display='block';setTimeout(()=>el.style.display='none',2200)}
function showLevelUp(level){document.getElementById('levelupNum').textContent=level;document.getElementById('levelupText').textContent=`你已達到 Lv.${level}`;document.getElementById('levelup').style.display='flex'}
document.getElementById('levelupClose').onclick=()=>document.getElementById('levelup').style.display='none';
async function submitCurrentAnswer(q,isCorrect,usedHint=false){if(submitting)return null;submitting=true;try{const result=await submitAnswer({questionId:q.id,kpId:q.kpId,isCorrect,attemptCount,responseTimeMs:Date.now()-currentStartedAt,usedHint,localDate:todayStr()});const previousLevel=manager.getLevelInfo().level;manager.applyServerState({totalXp:result.totalXp,todayXp:result.todayXp,todayXpDate:todayStr(),streak:result.streak,streakFreezes:result.streakFreezes,dailyGoalXp:manager.state.dailyGoalXp||20,level:result.level});refreshTopUI();if(result.streakIncreased)toast();if(result.level>previousLevel)setTimeout(()=>showLevelUp(result.level),350);return result}catch(e){console.error('提交答案失敗',e);return null}finally{submitting=false}}
function normalizeQuestion(raw){const q={...raw};if(q.type==='choice')q.options=Array.isArray(q.options)?q.options:String(q.options||'').split('|');if(q.type==='reorder'){const arr=Array.isArray(q.options)?q.options:String(q.options||'').split('|');q.options=[...arr].sort(()=>Math.random()-.5);q.answer=Array.isArray(q.answer)?q.answer:String(q.answer||'').split('|')}if(q.type==='match'&&!Array.isArray(q.options))q.options=String(q.options||'').split(';').map(x=>x.split('|'));if(q.type==='mark'){q.options=Array.isArray(q.options)?q.options:String(q.options||'').split('/');q.answer=Array.isArray(q.answer)?q.answer:String(q.answer||'').split('|').map(Number)}return q}
function nextQuestion(){currentIndex++;currentStartedAt=Date.now();attemptCount=1;renderQuiz()}
function renderQuiz(){const c=document.getElementById('quizContent');c.innerHTML='';if(currentIndex>=questions.length){c.innerHTML='<div class="no-more">今日學習完成！🎉<br><small>明天再來繼續你的文言文學習吧！</small></div>';return}const q=normalizeQuestion(questions[currentIndex]);if(q.type==='choice')renderChoice(c,q);else if(q.type==='reorder')renderReorder(c,q);else if(q.type==='match')renderMatch(c,q);else if(q.type==='fill')renderFill(c,q);else if(q.type==='mark')renderMark(c,q);else nextQuestion()}
function renderChoice(c,q){c.innerHTML=`<div class="question">${q.question}</div><div id="opts"></div><div id="fb"></div><button class="action" id="next" disabled>下一題</button>`;const opts=c.querySelector('#opts');q.options.forEach(opt=>{const b=document.createElement('button');b.className='option';b.textContent=opt;b.onclick=async()=>{opts.querySelectorAll('button').forEach(x=>x.disabled=true);const correct=opt===q.answer;const r=await submitCurrentAnswer(q,correct);const xp=r?.xpEarned??0;b.classList.add(correct?'correct':'wrong');c.querySelector('#fb').className=`feedback ${correct?'correct':'wrong'}`;c.querySelector('#fb').textContent=correct?`答對了！+${xp} XP`:`正確答案：${q.answer}（+${xp} XP）`;c.querySelector('#next').disabled=false};opts.appendChild(b)});c.querySelector('#next').onclick=nextQuestion}
function renderReorder(c,q){c.innerHTML=`<div class="question">${q.question}</div><div class="drop-zone" id="zone"></div><div class="word-bank" id="bank"></div><button class="action" id="check">檢查答案</button><div id="fb"></div><button class="action" id="next" disabled>下一題</button>`;const bank=c.querySelector('#bank'),zone=c.querySelector('#zone');q.options.forEach(w=>{const t=document.createElement('div');t.className='word-tile';t.textContent=w;t.onclick=()=>t.parentElement===bank?zone.appendChild(t):bank.appendChild(t);bank.appendChild(t)});c.querySelector('#check').onclick=async()=>{c.querySelector('#check').disabled=true;const current=[...zone.children].map(x=>x.textContent);const correct=JSON.stringify(current)===JSON.stringify(q.answer);const r=await submitCurrentAnswer(q,correct);c.querySelector('#fb').className=`feedback ${correct?'correct':'wrong'}`;c.querySelector('#fb').textContent=correct?`正確！+${r?.xpEarned??0} XP`:`順序不對，正確語序：${q.answer.join('')}`;c.querySelector('#next').disabled=false};c.querySelector('#next').onclick=nextQuestion}
function renderFill(c,q){c.innerHTML=`<div class="question">${q.question.replace('____________','')}</div><input class="fill-input" id="input" placeholder="請輸入答案"><button class="action" id="check">提交</button><div id="fb"></div><button class="action" id="next" disabled>下一題</button>`;const normalize=s=>String(s).replace(/[，。、；：！？\s]/g,'');c.querySelector('#check').onclick=async()=>{c.querySelector('#check').disabled=true;const correct=normalize(c.querySelector('#input').value)===normalize(q.answer);const r=await submitCurrentAnswer(q,correct);c.querySelector('#fb').className=`feedback ${correct?'correct':'wrong'}`;c.querySelector('#fb').textContent=correct?`默寫正確！+${r?.xpEarned??0}`:`正確答案：${q.answer}`;c.querySelector('#next').disabled=false};c.querySelector('#next').onclick=nextQuestion}
function renderMatch(c,q){c.innerHTML=`<div class="question">${q.question}</div><div class="match-container"><div class="match-col" id="left"></div><div class="match-col" id="right"></div></div><div id="fb"></div><button class="action" id="next" disabled>下一題</button>`;const left=c.querySelector('#left'),right=c.querySelector('#right');const pairs=Array.isArray(q.options)?q.options:[];let selected=null,matched=0;pairs.forEach((p,i)=>{const a=document.createElement('div');a.className='match-item';a.textContent=p[0];a.dataset.i=i;a.onclick=()=>{if(a.classList.contains('matched'))return;selected=i;left.querySelectorAll('.match-item').forEach(x=>x.classList.remove('selected'));a.classList.add('selected')};left.appendChild(a);const b=document.createElement('div');b.className='match-item';b.textContent=p[1];b.dataset.i=i;b.onclick=async()=>{if(b.classList.contains('matched')||selected===null)return;if(Number(b.dataset.i)===selected){a.classList.add('matched');b.classList.add('matched');a.classList.remove('selected');selected=null;matched++;if(matched===pairs.length){const r=await submitCurrentAnswer(q,true);c.querySelector('#fb').className='feedback correct';c.querySelector('#fb').textContent=`全部配對成功！+${r?.xpEarned??0} XP`;c.querySelector('#next').disabled=false}}else{const r=await submitCurrentAnswer(q,false);c.querySelector('#fb').className='feedback wrong';c.querySelector('#fb').textContent=`配對錯誤（+${r?.xpEarned??0} XP），再試一次`}}};right.appendChild(b)})
c.querySelector('#next').onclick=nextQuestion}
function renderMark(c,q){c.innerHTML=`<div class="question">${q.question}</div><div id="sentence"></div><div id="fb"></div><button class="action" id="next" disabled>下一題</button>`;const s=c.querySelector('#sentence');let found=0;q.options.forEach((ch,i)=>{const span=document.createElement('span');span.className='mark-char';span.textContent=ch;span.onclick=()=>{if(q.answer.includes(i)&&span.dataset.found!=='1'){span.dataset.found='1';span.style.background='#d7ffb8';found++;c.querySelector('#fb').className='feedback correct';c.querySelector('#fb').textContent=`「${ch}」正確！`;if(found===q.answer.length)submitCurrentAnswer(q,true).then(r=>{c.querySelector('#fb').textContent=`全部找到了！+${r?.xpEarned??0} XP`;c.querySelector('#next').disabled=false})}else if(!q.answer.includes(i)){span.style.background='#ffdfe0';c.querySelector('#fb').className='feedback wrong';c.querySelector('#fb').textContent='這個字不是答案，再找找看'}};s.appendChild(span)});c.querySelector('#next').onclick=nextQuestion}

async function startDailyLearning(){document.getElementById('dailyPlanCard').style.display='none';document.getElementById('quizCard').style.display='block';currentIndex=0;questions=buildDailyQueue(dailyPlan,questions);if(!questions.length){document.getElementById('quizContent').innerHTML='<div class="no-more">暫時沒有可用題目。</div>';return}renderQuiz()}

async function syncCloud(){
  const status=document.getElementById('syncStatus');
  try{
    const [uid,remoteQuestions]=await Promise.all([ensureLogin(),fetchAllQuestions()]);
    if(remoteQuestions?.length)questions=remoteQuestions;
    if(uid){
      const cloud=await fetchUserGamification(uid);
      await manager.init(uid,cloud);
      try{
        const remotePlan=await loadDailyPlan(questions);
        if(remotePlan?.items?.length){
          dailyPlan=remotePlan;
          renderDailyPlanCard(document.getElementById('dailyPlanCard'),dailyPlan,startDailyLearning);
        }
      }catch(e){console.warn('雲端學習計劃暫時不可用，保留本地計劃',e)}
      status.textContent='☁️ 已連接雲端，學習進度由伺服器管理';
    }else{
      status.textContent='⚠️ 離線模式，可先正常學習';
    }
    refreshTopUI();
  }catch(e){
    console.warn('雲端同步失敗，繼續使用本地模式',e);
    status.textContent='⚠️ 雲端同步暫時不可用，可先正常學習';
    refreshTopUI();
  }
}

async function init(){
  // 先初始化本地狀態並立即顯示可用題目；任何 Firebase 問題都不能阻塞首頁。
  await manager.init(null,null);
  renderDailyPlanCard(document.getElementById('dailyPlanCard'),dailyPlan,startDailyLearning);
  refreshTopUI();
  // Firebase 在背景同步，不再成為首頁進入條件。
  void syncCloud();
}

init();
</script>
</body>
</html>
