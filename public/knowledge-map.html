<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manjingo｜學習地圖</title>
<style>
:root{--green:#58cc02;--light-green:#d7ffb8;--blue:#1cb0f6;--ink:#000437;--text:#4b4b4b;--gray:#afafaf;--gold:#ffc800;--bg:#f7f7f7}*{box-sizing:border-box}body{font-family:'Noto Sans TC',system-ui,sans-serif;max-width:680px;margin:0 auto;padding:20px 16px 50px;color:var(--text);background:var(--bg)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}h1{color:var(--green);margin:0;font-size:30px}a{color:var(--blue);font-weight:800;text-decoration:none}.summary,.unit{background:#fff;border:2px solid #ddd;border-radius:20px;padding:16px;margin-bottom:16px}.summary-title{font-size:22px;font-weight:900;color:var(--ink);margin-bottom:6px}.summary-stats{display:flex;gap:8px}.stat{flex:1;background:#f5f5f5;border-radius:12px;padding:10px;text-align:center}.stat strong{display:block;font-size:20px;color:var(--ink)}.stat span{font-size:12px;font-weight:700}.unit-title{font-size:20px;font-weight:900;color:var(--ink);margin-bottom:14px}.path{position:relative;padding:4px 4px 4px 8px}.path:before{content:'';position:absolute;left:29px;top:30px;bottom:30px;width:6px;background:#e5e5e5;border-radius:6px}.node{position:relative;display:flex;align-items:center;gap:14px;margin:12px 0;min-height:70px}.circle{width:48px;height:48px;flex:0 0 48px;border-radius:50%;border:3px solid var(--gray);background:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:900;z-index:1}.node.done .circle{background:var(--green);border-color:var(--ink);color:#fff}.node.active .circle{background:var(--blue);border-color:var(--ink);color:#fff}.node.locked .circle{background:#eee;color:#aaa}.node-info{flex:1}.node-name{font-weight:900;color:var(--ink)}.node-meta{font-size:12px;color:var(--gray);font-weight:700;margin-top:3px}.mastery{height:8px;background:#eee;border-radius:8px;margin-top:7px;overflow:hidden}.mastery-fill{height:100%;background:var(--green)}.empty{padding:25px;text-align:center;font-weight:800;color:var(--gray)}.legend{font-size:12px;color:var(--gray);font-weight:700;margin-top:12px}
</style>
</head>
<body>
<header><h1>🗺️ 學習地圖</h1><a href="./index.html">← 今日學習</a></header>
<div id="app"><div class="empty">正在載入你的學習地圖……</div></div>
<script type="module">
import {ensureLogin,fetchAllKnowledgePoints,fetchUserKnowledgeState} from './firebase-config.js';

const labels={new:'未開始',learning:'學習中',familiar:'熟悉',mastered:'精通'};
function masteryStatus(m){m=Number(m||0);if(m>=90)return'mastered';if(m>=70)return'familiar';if(m>0)return'learning';return'new'}
function groupPoints(points){const groups=new Map();points.forEach((p,i)=>{const category=String(p.category||p.unit||'文言文基礎');if(!groups.has(category))groups.set(category,[]);groups.get(category).push({...p,_order:Number(p.order??p.sequence??i)});});return [...groups.entries()].map(([name,items])=>[name,items.sort((a,b)=>a._order-b._order)])}
function render(points,state){const app=document.getElementById('app');if(!points.length){app.innerHTML='<div class="summary"><div class="summary-title">學習地圖</div><div class="empty">目前尚未建立知識點資料。<br>先加入 knowledgePoints 後，地圖會自動生成。</div></div>';return}const statuses=points.map(p=>masteryStatus(state[p.id]?.mastery));const counts={new:0,learning:0,familiar:0,mastered:0};statuses.forEach(s=>counts[s]++);let html=`<div class="summary"><div class="summary-title">我的文言文進度</div><div class="summary-stats"><div class="stat"><strong>${counts.mastered}</strong><span>精通</span></div><div class="stat"><strong>${counts.familiar}</strong><span>熟悉</span></div><div class="stat"><strong>${counts.learning}</strong><span>學習中</span></div><div class="stat"><strong>${counts.new}</strong><span>未開始</span></div></div></div>`;groupPoints(points).forEach(([name,items])=>{html+=`<section class="unit"><div class="unit-title">${name}</div><div class="path">`;items.forEach((p,i)=>{const m=Number(state[p.id]?.mastery||0);const status=masteryStatus(m);const icon=status==='mastered'?'✓':status==='familiar'?'★':status==='learning'?'•':'🔒';html+=`<div class="node ${status}"><div class="circle">${icon}</div><div class="node-info"><div class="node-name">${p.name||p.title||p.label||p.id}</div><div class="node-meta">${labels[status]} · 掌握度 ${m}%</div><div class="mastery"><div class="mastery-fill" style="width:${Math.min(100,m)}%"></div></div></div></div>`});html+='</div></section>'});html+='<div class="legend">掌握度由答題紀錄自動更新。下一階段可加入「前置知識／解鎖」規則，讓地圖真正成為循序學習路徑。</div>';app.innerHTML=html}
async function init(){try{const uid=await ensureLogin();const points=await fetchAllKnowledgePoints();const state=uid?await fetchUserKnowledgeState(uid):{};render(points,state)}catch(e){console.error(e);document.getElementById('app').innerHTML='<div class="summary"><div class="empty">學習地圖暫時無法載入，請稍後再試。</div></div>'}}init();
</script>
</body>
</html>
