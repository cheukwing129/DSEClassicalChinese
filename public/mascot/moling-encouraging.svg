<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 215 320" role="img" aria-labelledby="title desc">
  <title id="title">小墨靈・鼓勵</title>
  <desc id="desc">Manjingo 小墨靈的 encouraging 候選 artwork v2；以溫和專注的眼神、輕微前傾與胸口高度的開放伸手姿勢表達陪伴與支持，不傳達責備或失望。</desc>
  <defs>
    <linearGradient id="inkBody" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#176d6b"/>
      <stop offset="0.58" stop-color="#0f5a5a"/>
      <stop offset="1" stop-color="#083f4d"/>
    </linearGradient>
    <linearGradient id="inkArm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#176d6b"/>
      <stop offset="1" stop-color="#0b4b53"/>
    </linearGradient>
  </defs>

  <!-- Slight forward lean: attentive rather than celebratory. -->
  <g transform="rotate(-3 108 175)">
    <path d="M108 24C97 47 74 60 61 82c-18 30-18 72-12 111 6 40 18 78 42 94 10 7 24 10 34 4 28-15 39-59 44-98 5-39 4-81-14-111-13-22-36-35-47-58Z" fill="url(#inkBody)" stroke="#000437" stroke-width="5" stroke-linejoin="round"/>

    <!-- Near arm stays low and calm so the face remains visually clean at 34–42px. -->
    <path d="M67 187c-9 1-16 5-22 10-5 5-6 11-2 15 4 4 10 4 15 0 6-5 12-7 19-7" fill="url(#inkArm)" stroke="#000437" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Open supportive reach toward the learner, kept at chest height. -->
    <path d="M145 188c12-1 23-5 32-11 6-4 12-4 15 1 3 5 1 10-4 13-11 7-24 12-39 13" fill="url(#inkArm)" stroke="#000437" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M188 178c5 0 9 1 12 4" fill="none" stroke="#000437" stroke-width="4" stroke-linecap="round"/>

    <path d="M77 279c-9 4-17 10-18 18 10 3 21 1 30-7" fill="#0b4b53" stroke="#000437" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M139 279c9 4 17 10 18 18-10 3-21 1-30-7" fill="#0b4b53" stroke="#000437" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g aria-hidden="true">
      <ellipse cx="82" cy="122" rx="27" ry="31" fill="#fff" stroke="#000437" stroke-width="4"/>
      <ellipse cx="134" cy="122" rx="27" ry="31" fill="#fff" stroke="#000437" stroke-width="4"/>
      <ellipse cx="87" cy="126" rx="11" ry="14" fill="#000437"/>
      <ellipse cx="129" cy="126" rx="11" ry="14" fill="#000437"/>
      <circle cx="91" cy="120" r="4" fill="#fff"/>
      <circle cx="133" cy="120" r="4" fill="#fff"/>
      <!-- Brows remain open and attentive; never angled down in anger. -->
      <path d="M72 92c8-5 17-6 27-2" fill="none" stroke="#000437" stroke-width="4" stroke-linecap="round"/>
      <path d="M117 90c10-4 20-3 27 2" fill="none" stroke="#000437" stroke-width="4" stroke-linecap="round"/>
      <!-- Small supportive smile, deliberately quieter than happy. -->
      <path d="M88 169c6 5 13 7 20 7 8 0 15-2 21-7" fill="none" stroke="#000437" stroke-width="5" stroke-linecap="round"/>
      <circle cx="65" cy="158" r="5" fill="#d4a85b" opacity=".11"/>
      <circle cx="151" cy="158" r="5" fill="#d4a85b" opacity=".11"/>
    </g>
  </g>
</svg>
