<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>文言自學平台 - 練習原型</title>
<style>
  body { font-family: "Noto Sans TC", sans-serif; max-width: 600px; margin: 40px auto; background:#f7f6f2; color:#333; }
  .card { background:#fff; border-radius:16px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.08); margin-bottom:20px; }
  .progress-bar { height:10px; background:#e0e0e0; border-radius:6px; overflow:hidden; margin-bottom:16px; }
  .progress-fill { height:100%; background:#58cc02; width:20%; transition: width .3s; }
  .question { font-size:18px; margin-bottom:16px; line-height:1.6; }
  .option { display:block; width:100%; padding:12px; margin-bottom:10px; border:2px solid #e0e0e0; border-radius:12px; background:#fff; cursor:pointer; font-size:16px; text-align:left; }
  .option:hover { border-color:#1cb0f6; }
  .option.correct { border-color:#58cc02; background:#d7ffb8; }
  .option.wrong { border-color:#ff4b4b; background:#ffdfe0; }
  .feedback { margin-top:16px; padding:12px; border-radius:10px; font-weight:bold; }
  .feedback.correct { background:#d7ffb8; color:#2b7a00; }
  .feedback.wrong { background:#ffdfe0; color:#c40000; }
  .xp-badge { display:inline-block; background:#ffc800; color:#7a5b00; padding:4px 12px; border-radius:20px; font-size:14px; font-weight:bold; }
  .streak { color:#ff9600; font-weight:bold; }
  button.next-btn { margin-top:16px; width:100%; padding:14px; background:#58cc02; color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:bold; cursor:pointer; }
  button.next-btn:disabled { background:#ccc; cursor:not-allowed; }
  h2 { margin-top:0; }
</style>
</head>
<body>

<div class="card">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
    <span class="xp-badge">XP 240</span>
    <span class="streak">連續 5 日</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <h2 id="textTitle">文言字詞句式 — 基礎關</h2>
</div>

<div class="card" id="quizCard">
  <div class="question" id="questionText">『謫守巴陵郡』中『謫』字的意思是？</div>
  <div id="optionsContainer"></div>
  <div id="feedbackBox"></div>
  <button class="next-btn" id="nextBtn" disabled>下一題</button>
</div>

<script type="module">
import { ensureLogin, fetchQuestionsByText, getSubmitAnswerFn } from "./firebase-config.js";

const fallbackQuestions = [
  { id:"q001", kpId:"kp_yueyang_001", question:"『謫守巴陵郡』中『謫』字的意思是？",
    options:["提拔","貶官","辭職","退休"], answer:"貶官" },
  { id:"q004", kpId:"kp_virtual_zhi", question:"『輟耕之壟上』中『之』字的用法是？",
    options:["代詞","結構助詞(的)","動詞(到/往)","語氣助詞"], answer:"動詞(到/往)" }
];

let questions = fallbackQuestions;
let currentIndex = 0;
let attemptCount = 1;
let xp = 240;

async function init() {
  try {
    await ensureLogin();
    const remote = await fetchQuestionsByText("yueyanglou");
    if (remote && remote.length) questions = remote;
  } catch (e) {
    console.warn("Firebase 尚未設定，使用本地示範題目", e);
  }
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentIndex];
  document.getElementById("questionText").textContent = q.question;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  document.getElementById("feedbackBox").innerHTML = "";
  document.getElementById("nextBtn").disabled = true;
  attemptCount = 1;

  q.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = opt;
    btn.onclick = () => handleAnswer(btn, opt, q);
    container.appendChild(btn);
  });

  document.getElementById("progressFill").style.width =
    `${Math.round(((currentIndex+1)/questions.length)*100)}%`;
}

async function handleAnswer(btn, selected, q) {
  const isCorrect = selected === q.answer;
  document.querySelectorAll(".option").forEach(b => b.onclick = null);

  if (isCorrect) {
    btn.classList.add("correct");
    xp += 10;
    document.querySelector(".xp-badge").textContent = `XP ${xp}`;
    document.getElementById("feedbackBox").innerHTML =
      `<div class="feedback correct">答對了！+10 XP</div>`;
  } else {
    btn.classList.add("wrong");
    document.getElementById("feedbackBox").innerHTML =
      `<div class="feedback wrong">答錯了，正確答案是：${q.answer}</div>`;
    attemptCount += 1;
  }

  try {
    const submitAnswer = getSubmitAnswerFn();
    const result = await submitAnswer({
      kpId: q.kpId, isCorrect, usedHint: false, attemptCount
    });
    console.log("SM-2 更新結果：", result.data);
  } catch (e) {
    console.warn("submitAnswer 尚未連接後端", e);
  }

  document.getElementById("nextBtn").disabled = false;
}

document.getElementById("nextBtn").onclick = () => {
  currentIndex++;
  if (currentIndex < questions.length) {
    renderQuestion();
  } else {
    document.getElementById("quizCard").innerHTML =
      `<div class="feedback correct" style="font-size:18px;">本關完成！獲得 ${xp - 240} XP</div>`;
  }
};

init();
</script>

</body>
</html>
